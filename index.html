<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASP Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="site-header">ASP Student Portal</h1>
    <main class="dashboard-container">
    <section class="card-box">
        <h2>Register for Course</h2>
            <form action="/register" method="POST">
            <div class="form-group">
                <label for="student-name">Student Name:</label>
                <input id="student-name" name="fullname" type="text" required>
            </div>
            <div class="form-group">
                <label for="student-email">Email Address:</label>        
                <input id="student-email" name="email" type="email" required>
            </div>
            <button type="submit" class="submit-btn">Submit Registration</button>
            </form>
    </section>
    <section class="card-box">
        <h2>Upcoming Schedule</h2>
            <table class="schedule-table">
                <thead>
                    <tr><th>Course</th><th>Day</th><th>Room</th></tr>
                </thead>
                <tbody>
                    <tr><td>Web Dev</td><td>Monday</td><td>Lab 101</td></tr>
                    <tr><td>JS Core</td><td>Wednesday</td><td>Lab 102</td></tr>
                    <tr><td colspan="3" class="break-cell">Midday Break</td></tr>
                </tbody>
            </table>
    </section>
    </main>
<footer class="site-footer">
    <p>Visit our official site: <a href="https://www.astemprep.org/" target="_blank">ASP  Website</a></p>
 </footer>
</body>
</html>
